name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit (prod deps)
        run: npm audit --omit=dev --audit-level=low

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Release verification
        run: npm run release:check
